name: Reajuste de preço (agendado)

on:
  schedule:
    # 05/10 às 03:05 UTC = 00:05 em Brasília. Apague este arquivo depois da virada.
    - cron: '5 3 5 10 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge da branch reajuste na main
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout main
          git merge origin/reajuste --no-edit
          git push origin main
